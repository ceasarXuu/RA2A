name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Verify tag matches binary
        run: test "$(go run ./cmd/ra2a version)" = "$GITHUB_REF_NAME"
      - name: Test release source
        run: |
          go test ./...
          go vet ./...
      - name: Build release assets
        run: |
          mkdir -p dist
          for target in "darwin amd64" "darwin arm64" "linux amd64" "linux arm64" "windows amd64" "windows arm64"; do
            set -- $target
            os=$1
            arch=$2
            name="ra2a-${GITHUB_REF_NAME}-${os}-${arch}"
            if [ "$os" = windows ]; then name="${name}.exe"; fi
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags '-s -w' -o "dist/$name" ./cmd/ra2a
            (cd dist && sha256sum "$name" >"$name.sha256")
          done
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
